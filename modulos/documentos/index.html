
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Documentos - Portal del Cliente</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <main
    class="portal-container"
  >


    <!-- =================================================
         CABECERA
         ================================================= -->

    <section
      class="welcome-section"
      style="
        margin-bottom: 25px;
      "
    >

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 20px;
          flex-wrap: wrap;
        "
      >

        <div>

          <div
            style="
              font-size: 42px;
              margin-bottom: 10px;
            "
          >
            📄
          </div>

          <h2
            style="
              margin-bottom: 8px;
            "
          >
            Documentos
          </h2>

          <p
            id="nombreUsuario"
          >
            Cargando...
          </p>

        </div>


        <div
          style="
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
          "
        >

          <a
            href="../../index.html"
            class="btn"
            style="
              text-decoration: none;
              display: inline-flex;
              align-items: center;
              justify-content: center;
            "
          >
            ← Volver al portal
          </a>


          <button
            id="cerrarSesion"
            type="button"
            class="btn"
          >
            Cerrar sesión
          </button>

        </div>

      </div>

    </section>



    <!-- =================================================
         SUBIR DOCUMENTO
         ================================================= -->

    <section
      style="
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 25px;
      "
    >

      <div
        style="
          margin-bottom: 25px;
        "
      >

        <h3
          style="
            margin-top: 0;
            margin-bottom: 8px;
            color: #111827;
          "
        >
          Subir documento
        </h3>

        <p
          style="
            margin: 0;
            color: #6b7280;
            font-size: 14px;
          "
        >
          Añade un documento para que tu asesoría pueda gestionarlo.
        </p>

      </div>


      <form id="documentoForm">


        <!-- NOMBRE -->

        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="nombre"
            style="
              display: block;
              margin-bottom: 7px;
              font-size: 14px;
              font-weight: 600;
              color: #374151;
            "
          >
            Nombre del documento
          </label>

          <input
            type="text"
            id="nombre"
            name="nombre"
            required
            placeholder="Ej.: Factura de agosto"
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #d1d5db;
              border-radius: 8px;
              font-size: 15px;
              outline: none;
              box-sizing: border-box;
            "
          >

        </div>



        <!-- TIPO -->

        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="tipo"
            style="
              display: block;
              margin-bottom: 7px;
              font-size: 14px;
              font-weight: 600;
              color: #374151;
            "
          >
            Tipo de documento
          </label>

          <input
            type="text"
            id="tipo"
            name="tipo"
            placeholder="Ej.: Factura, contrato, certificado..."
            required
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #d1d5db;
              border-radius: 8px;
              font-size: 15px;
              outline: none;
              box-sizing: border-box;
            "
          >

        </div>



        <!-- ARCHIVO -->

        <div
          style="
            margin-bottom: 25px;
          "
        >

          <label
            for="archivo"
            style="
              display: block;
              margin-bottom: 7px;
              font-size: 14px;
              font-weight: 600;
              color: #374151;
            "
          >
            Archivo
          </label>

          <input
            type="file"
            id="archivo"
            name="archivo"
            required
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #d1d5db;
              border-radius: 8px;
              font-size: 14px;
              box-sizing: border-box;
              background: #f9fafb;
            "
          >

        </div>



        <!-- BOTÓN -->

        <button
          type="submit"
          id="subirDocumentoButton"
          class="btn btn-primary"
          style="
            padding: 12px 20px;
          "
        >
          Subir documento
        </button>


        <p
          id="subidaMessage"
          class="message"
          style="
            margin-top: 15px;
          "
        ></p>


      </form>

    </section>



    <!-- =================================================
         MIS DOCUMENTOS
         ================================================= -->

    <section
      style="
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 30px;
      "
    >

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          flex-wrap: wrap;
          margin-bottom: 25px;
        "
      >

        <div>

          <h3
            style="
              margin-top: 0;
              margin-bottom: 8px;
              color: #111827;
            "
          >
            Mis documentos
          </h3>

          <p
            style="
              margin: 0;
              color: #6b7280;
              font-size: 14px;
            "
          >
            Consulta y descarga los documentos asociados a tu cuenta.
          </p>

        </div>


        <button
          id="recargarDocumentos"
          type="button"
          class="btn"
        >
          ↻ Recargar
        </button>

      </div>


      <p
        id="listadoMessage"
        class="message"
      ></p>


      <div
        id="documentosContainer"
      >
        Cargando documentos...
      </div>


    </section>


  </main>



  <!-- =================================================
       JAVASCRIPT COMÚN
       ================================================= -->

  <script src="../../js/comun.js"></script>



  <!-- =================================================
       DOCUMENTOS
       ================================================= -->

  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const API_URL =
      "https://kit-asesoria-backend.vhtza8.easypanel.host";


    // =====================================================
    // SESIÓN
    // =====================================================

    const token =
      localStorage.getItem("token");

    const usuarioGuardado =
      localStorage.getItem("usuario");


    if (!token || !usuarioGuardado) {

      window.location.href =
        "../../login.html";

    }


    let usuario;
    let clienteId = null;


    try {

      usuario =
        JSON.parse(usuarioGuardado);


      document
        .getElementById("nombreUsuario")
        .textContent =
          `Hola, ${usuario.nombre}`;


    } catch (error) {

      console.error(
        "Error leyendo los datos del usuario:",
        error
      );


      localStorage.removeItem("token");
      localStorage.removeItem("usuario");


      window.location.href =
        "../../login.html";

    }



    // =====================================================
    // OBTENER CLIENTE AUTENTICADO
    // =====================================================

    async function cargarCliente() {

      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/cliente`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se ha podido obtener el cliente."
          );

        }


        clienteId =
          datos.cliente.id;


        return datos.cliente;


      } catch (error) {

        console.error(
          "Error obteniendo cliente:",
          error
        );


        alert(
          "No se han podido cargar los datos del cliente."
        );


        return null;

      }

    }



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        () => {

          localStorage.removeItem("token");
          localStorage.removeItem("usuario");


          window.location.href =
            "../../login.html";

        }
      );



    // =====================================================
    // CARGAR DOCUMENTOS
    // =====================================================

    async function cargarDocumentos() {

      const container =
        document.getElementById(
          "documentosContainer"
        );


      const message =
        document.getElementById(
          "listadoMessage"
        );


      container.innerHTML =
        "Cargando documentos...";


      message.textContent =
        "";


      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/documentos`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          container.innerHTML =
            "";


          message.textContent =
            datos.message ||
            "No se han podido cargar los documentos.";


          return;

        }


        if (
          !Array.isArray(datos.documentos) ||
          datos.documentos.length === 0
        ) {

          container.innerHTML = `

            <div
              style="
                text-align: center;
                padding: 40px 20px;
                color: #6b7280;
              "
            >

              <div
                style="
                  font-size: 42px;
                  margin-bottom: 12px;
                "
              >
                📂
              </div>

              <p
                style="
                  margin: 0;
                "
              >
                No tienes documentos disponibles.
              </p>

            </div>

          `;


          return;

        }


        container.innerHTML =
          "";


        datos.documentos.forEach(
          (documento) => {

            const article =
              document.createElement(
                "article"
              );


            article.style.cssText = `
              border: 1px solid #e5e7eb;
              border-radius: 10px;
              padding: 20px;
              margin-bottom: 15px;
              background: #f9fafb;
            `;


            const cabecera =
              document.createElement(
                "div"
              );


            cabecera.style.cssText = `
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              gap: 15px;
              flex-wrap: wrap;
              margin-bottom: 15px;
            `;


            const nombre =
              document.createElement(
                "h3"
              );


            nombre.textContent =
              documento.nombre;


            nombre.style.cssText = `
              margin: 0;
              color: #111827;
              font-size: 17px;
            `;


            const estado =
              document.createElement(
                "span"
              );


            estado.textContent =
              documento.estado;


            estado.style.cssText = `
              display: inline-block;
              padding: 5px 10px;
              border-radius: 999px;
              background: #eef2ff;
              color: #4338ca;
              font-size: 12px;
              font-weight: 600;
            `;


            cabecera.appendChild(
              nombre
            );


            cabecera.appendChild(
              estado
            );


            const informacion =
              document.createElement(
                "div"
              );


            informacion.style.cssText = `
              color: #4b5563;
              font-size: 14px;
              line-height: 1.7;
              margin-bottom: 18px;
            `;


            informacion.innerHTML = `

              <div>
                <strong>Archivo:</strong>
                ${escapeHtml(documento.nombreArchivo)}
              </div>

              <div>
                <strong>Tipo:</strong>
                ${escapeHtml(documento.tipo)}
              </div>

              <div>
                <strong>Fecha:</strong>
                ${formatearFecha(documento.createdAt)}
              </div>

            `;


            const descargar =
              document.createElement(
                "button"
              );


            descargar.type =
              "button";


            descargar.className =
              "btn btn-primary";


            descargar.textContent =
              "↓ Descargar";


            descargar.addEventListener(
              "click",
              () =>
                descargarDocumento(
                  documento.id
                )
            );


            article.appendChild(
              cabecera
            );


            article.appendChild(
              informacion
            );


            article.appendChild(
              descargar
            );


            container.appendChild(
              article
            );

          }
        );


      } catch (error) {

        console.error(
          "Error cargando documentos:",
          error
        );


        container.innerHTML =
          "";


        message.textContent =
          "No se ha podido conectar con el servidor.";

      }

    }



    // =====================================================
    // DESCARGAR DOCUMENTO
    // =====================================================

    async function descargarDocumento(id) {

      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/documentos/${id}/descargar`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        if (!respuesta.ok) {

          let datos = {};


          try {

            datos =
              await respuesta.json();

          } catch (error) {
            // La respuesta puede no ser JSON.
          }


          alert(
            datos.message ||
            "No se ha podido descargar el documento."
          );


          return;

        }


        const blob =
          await respuesta.blob();


        const url =
          window.URL.createObjectURL(
            blob
          );


        const enlace =
          document.createElement(
            "a"
          );


        enlace.href =
          url;


        enlace.download =
          "documento";


        document.body.appendChild(
          enlace
        );


        enlace.click();


        enlace.remove();


        window.URL.revokeObjectURL(
          url
        );


      } catch (error) {

        console.error(
          "Error descargando documento:",
          error
        );


        alert(
          "No se ha podido descargar el documento."
        );

      }

    }



    // =====================================================
    // SUBIR DOCUMENTO
    // =====================================================

    document
      .getElementById("documentoForm")
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const message =
            document.getElementById(
              "subidaMessage"
            );


          const button =
            document.getElementById(
              "subirDocumentoButton"
            );


          const nombre =
            document
              .getElementById("nombre")
              .value
              .trim();


          const tipo =
            document
              .getElementById("tipo")
              .value
              .trim();


          const archivo =
            document
              .getElementById("archivo")
              .files[0];


          if (
            !nombre ||
            !tipo ||
            !archivo
          ) {

            message.textContent =
              "Debes completar todos los campos.";


            return;

          }


          if (!clienteId) {

            const cliente =
              await cargarCliente();


            if (!cliente) {

              message.textContent =
                "No se han podido obtener los datos del cliente.";


              return;

            }

          }


          message.textContent =
            "Subiendo documento...";


          button.disabled =
            true;


          button.textContent =
            "Subiendo...";


          try {

            const formulario =
              new FormData();


            formulario.append(
              "clienteId",
              clienteId
            );


            formulario.append(
              "nombre",
              nombre
            );


            formulario.append(
              "tipo",
              tipo
            );


            formulario.append(
              "archivo",
              archivo
            );


            const respuesta =
              await fetch(
                `${API_URL}/api/documentos`,
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      `Bearer ${token}`
                  },

                  body: formulario
                }
              );


            const datos =
              await respuesta.json();


            if (
              !respuesta.ok ||
              !datos.ok
            ) {

              message.textContent =
                datos.message ||
                "No se ha podido subir el documento.";


              return;

            }


            message.textContent =
              "Documento subido correctamente.";


            document
              .getElementById(
                "documentoForm"
              )
              .reset();


            await cargarDocumentos();


          } catch (error) {

            console.error(
              "Error subiendo documento:",
              error
            );


            message.textContent =
              "No se ha podido conectar con el servidor.";

          } finally {

            button.disabled =
              false;


            button.textContent =
              "Subir documento";

          }

        }
      );



    // =====================================================
    // RECARGAR
    // =====================================================

    document
      .getElementById(
        "recargarDocumentos"
      )
      .addEventListener(
        "click",
        cargarDocumentos
      );



    // =====================================================
    // FORMATEAR FECHA
    // =====================================================

    function formatearFecha(fecha) {

      if (!fecha) {

        return "-";

      }


      const fechaObjeto =
        new Date(fecha);


      return fechaObjeto.toLocaleString(
        "es-ES",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }



    // =====================================================
    // ESCAPAR HTML
    // =====================================================

    function escapeHtml(valor) {

      const elemento =
        document.createElement(
          "div"
        );


      elemento.textContent =
        valor ?? "";


      return elemento.innerHTML;

    }



    // =====================================================
    // INICIO
    // =====================================================

    async function iniciarModulo() {

      const cliente =
        await cargarCliente();


      if (!cliente) {

        return;

      }


      await cargarDocumentos();

    }


    iniciarModulo();

  </script>


</body>

</html>
