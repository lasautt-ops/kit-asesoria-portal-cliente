
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Avisos - Portal del Cliente</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <div
        style="
          display: flex;
          align-items: center;
          gap: 14px;
        "
      >

        <div
          style="
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            border-radius: 12px;
            font-size: 24px;
          "
        >
          🔔
        </div>

        <div>

          <h1>
            Avisos
          </h1>

          <p id="nombreUsuario">
            Cargando...
          </p>

        </div>

      </div>

    </div>


    <div class="portal-header-right">

      <a
        href="../../index.html"
        class="btn btn-secondary"
        style="
          text-decoration: none;
        "
      >
        ← Volver al portal
      </a>

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="portal-container">


    <!-- ===================================================
         CABECERA DEL MÓDULO
         =================================================== -->

    <section class="welcome-section">

      <h2>
        Mis avisos
      </h2>

      <p>
        Consulta las comunicaciones y avisos de tu asesoría.
      </p>

    </section>



    <!-- ===================================================
         LISTADO DE AVISOS
         =================================================== -->

    <section class="dashboard-section">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          flex-wrap: wrap;
          margin-bottom: 25px;
        "
      >

        <div>

          <h2
            style="
              margin: 0 0 5px 0;
            "
          >
            Avisos recibidos
          </h2>

          <p
            style="
              margin: 0;
              color: #6b7280;
              font-size: 14px;
            "
          >
            Aquí aparecerán las comunicaciones dirigidas a ti.
          </p>

        </div>


        <button
          id="recargarAvisos"
          class="btn btn-primary"
          type="button"
        >
          ↻ Recargar avisos
        </button>

      </div>


      <p
        id="listadoMessage"
        class="message"
      ></p>


      <div
        id="avisosContainer"
        style="
          display: grid;
          gap: 18px;
        "
      >
        Cargando avisos...
      </div>

    </section>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

    Portal del Cliente · Kit Gestión Asesoría

  </footer>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const API_URL =
      "https://kit-asesoria-backend.vhtza8.easypanel.host";


    // =====================================================
    // SESIÓN
    // =====================================================

    const token =
      localStorage.getItem("token");


    const usuarioGuardado =
      localStorage.getItem("usuario");


    if (!token || !usuarioGuardado) {

      window.location.href =
        "../../login.html";
    }


    let usuario;


    try {

      usuario =
        JSON.parse(usuarioGuardado);


      document
        .getElementById("nombreUsuario")
        .textContent =
          `Hola, ${usuario.nombre}`;

    } catch (error) {

      console.error(
        "Error leyendo los datos del usuario:",
        error
      );


      localStorage.removeItem("token");
      localStorage.removeItem("usuario");


      window.location.href =
        "../../login.html";
    }



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        () => {

          localStorage.removeItem("token");
          localStorage.removeItem("usuario");

          window.location.href =
            "../../login.html";

        }
      );



    // =====================================================
    // CARGAR AVISOS
    // =====================================================

    async function cargarAvisos() {

      const container =
        document.getElementById(
          "avisosContainer"
        );


      const message =
        document.getElementById(
          "listadoMessage"
        );


      container.innerHTML = `
        <div
          style="
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #6b7280;
          "
        >
          Cargando avisos...
        </div>
      `;


      message.textContent = "";


      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/cliente/avisos`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          container.innerHTML = "";

          message.textContent =
            datos.message ||
            "No se han podido cargar los avisos.";

          return;
        }


        if (
          !Array.isArray(datos.avisos) ||
          datos.avisos.length === 0
        ) {

          container.innerHTML = `
            <div
              style="
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                padding: 45px 30px;
                text-align: center;
              "
            >

              <div
                style="
                  font-size: 42px;
                  margin-bottom: 15px;
                "
              >
                🔔
              </div>

              <h3
                style="
                  margin: 0 0 8px 0;
                  color: #111827;
                "
              >
                No tienes avisos
              </h3>

              <p
                style="
                  margin: 0;
                  color: #6b7280;
                "
              >
                No hay comunicaciones disponibles en este momento.
              </p>

            </div>
          `;

          return;
        }


        container.innerHTML = "";


        datos.avisos.forEach(
          (aviso) => {

            const article =
              document.createElement(
                "article"
              );


            article.style.cssText = `
              background: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 12px;
              padding: 24px;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            `;


            // =================================================
            // CABECERA DEL AVISO
            // =================================================

            const cabecera =
              document.createElement(
                "div"
              );


            cabecera.style.cssText = `
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              gap: 15px;
              flex-wrap: wrap;
              margin-bottom: 18px;
            `;


            // =================================================
            // TÍTULO
            // =================================================

            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              aviso.titulo;


            titulo.style.cssText = `
              margin: 0;
              color: #111827;
              font-size: 19px;
            `;


            // =================================================
            // INDICADOR LEÍDO / NO LEÍDO
            // =================================================

            const estadoLectura =
              document.createElement(
                "span"
              );


            estadoLectura.textContent =
              aviso.leido
                ? "✓ Leído"
                : "● No leído";


            estadoLectura.style.cssText =
              aviso.leido
                ? `
                  display: inline-flex;
                  align-items: center;
                  padding: 6px 10px;
                  border-radius: 999px;
                  background: #ecfdf5;
                  color: #047857;
                  font-size: 13px;
                  font-weight: 600;
                  white-space: nowrap;
                `
                : `
                  display: inline-flex;
                  align-items: center;
                  padding: 6px 10px;
                  border-radius: 999px;
                  background: #fff7ed;
                  color: #c2410c;
                  font-size: 13px;
                  font-weight: 600;
                  white-space: nowrap;
                `;


            cabecera.appendChild(
              titulo
            );


            cabecera.appendChild(
              estadoLectura
            );


            article.appendChild(
              cabecera
            );



            // =================================================
            // CONTENIDO
            // =================================================

            const contenido =
              document.createElement(
                "div"
              );


            contenido.textContent =
              aviso.contenido ||
              "Sin contenido";


            contenido.style.cssText = `
              color: #374151;
              line-height: 1.6;
              white-space: pre-wrap;
              margin-bottom: 22px;
            `;


            article.appendChild(
              contenido
            );



            // =================================================
            // INFORMACIÓN DEL AVISO
            // =================================================

            const informacion =
              document.createElement(
                "div"
              );


            informacion.style.cssText = `
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
              gap: 12px;
              padding: 16px;
              background: #f9fafb;
              border-radius: 10px;
              margin-bottom: 20px;
            `;


            // =================================================
            // TIPO
            // =================================================

            const tipo =
              document.createElement(
                "div"
              );


            tipo.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Tipo
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${aviso.tipo || "-"}
              </div>
            `;


            // =================================================
            // PRIORIDAD
            // =================================================

            const prioridad =
              document.createElement(
                "div"
              );


            prioridad.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Prioridad
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${aviso.prioridad || "-"}
              </div>
            `;


            // =================================================
            // FECHA PUBLICACIÓN
            // =================================================

            const fechaPublicacion =
              document.createElement(
                "div"
              );


            fechaPublicacion.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Publicado
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${formatearFecha(
                  aviso.fechaPublicacion ||
                  aviso.createdAt
                )}
              </div>
            `;


            // =================================================
            // FECHA CADUCIDAD
            // =================================================

            const fechaCaducidad =
              document.createElement(
                "div"
              );


            fechaCaducidad.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Caducidad
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${formatearFecha(
                  aviso.fechaCaducidad
                )}
              </div>
            `;


            informacion.appendChild(
              tipo
            );


            informacion.appendChild(
              prioridad
            );


            informacion.appendChild(
              fechaPublicacion
            );


            informacion.appendChild(
              fechaCaducidad
            );


            article.appendChild(
              informacion
            );



            // =================================================
            // CREADOR
            // =================================================

            const creador =
              document.createElement(
                "p"
              );


            creador.innerHTML = `
              <span
                style="
                  color: #6b7280;
                  font-size: 13px;
                "
              >
                Publicado por:
              </span>

              <strong
                style="
                  color: #374151;
                  font-size: 13px;
                "
              >
                ${aviso.creador?.nombre || "-"}
              </strong>
            `;


            creador.style.cssText = `
              margin: 0 0 18px 0;
            `;


            article.appendChild(
              creador
            );



            // =================================================
            // BOTÓN MARCAR COMO LEÍDO
            // =================================================

            const botonLeido =
              document.createElement(
                "button"
              );


            botonLeido.type =
              "button";


            botonLeido.className =
              "btn btn-primary";


            if (aviso.leido) {

              botonLeido.textContent =
                "✓ Aviso leído";

              botonLeido.disabled =
                true;

            } else {

              botonLeido.textContent =
                "Marcar como leído";


              botonLeido.addEventListener(
                "click",
                () =>
                  marcarComoLeido(
                    aviso.id,
                    botonLeido,
                    estadoLectura
                  )
              );
            }


            article.appendChild(
              botonLeido
            );


            container.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando avisos:",
          error
        );


        container.innerHTML = "";


        message.textContent =
          "No se ha podido conectar con el servidor.";

      }

    }



    // =====================================================
    // MARCAR AVISO COMO LEÍDO
    // =====================================================

    async function marcarComoLeido(
      avisoId,
      boton,
      indicador
    ) {

      boton.disabled =
        true;


      boton.textContent =
        "Guardando...";


      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/cliente/avisos/${avisoId}/leido`,
            {
              method: "PATCH",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido marcar el aviso como leído."
          );


          boton.disabled =
            false;


          boton.textContent =
            "Marcar como leído";


          return;
        }


        indicador.textContent =
          "✓ Leído";


        indicador.style.cssText = `
          display: inline-flex;
          align-items: center;
          padding: 6px 10px;
          border-radius: 999px;
          background: #ecfdf5;
          color: #047857;
          font-size: 13px;
          font-weight: 600;
          white-space: nowrap;
        `;


        boton.textContent =
          "✓ Aviso leído";


      } catch (error) {

        console.error(
          "Error marcando aviso como leído:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );


        boton.disabled =
          false;


        boton.textContent =
          "Marcar como leído";

      }

    }



    // =====================================================
    // RECARGAR AVISOS
    // =====================================================

    document
      .getElementById(
        "recargarAvisos"
      )
      .addEventListener(
        "click",
        cargarAvisos
      );



    // =====================================================
    // FORMATEAR FECHA
    // =====================================================

    function formatearFecha(
      fecha
    ) {

      if (!fecha) {
        return "-";
      }


      const fechaObjeto =
        new Date(fecha);


      if (
        Number.isNaN(
          fechaObjeto.getTime()
        )
      ) {

        return "-";
      }


      return fechaObjeto.toLocaleString(
        "es-ES",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }



    // =====================================================
    // INICIO
    // =====================================================

    cargarAvisos();

  </script>


</body>

</html>
