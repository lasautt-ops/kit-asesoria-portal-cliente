<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tareas - Portal del Cliente</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <div
        style="
          display: flex;
          align-items: center;
          gap: 14px;
        "
      >

        <div
          style="
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
          "
        >
          ✅
        </div>

        <div>

          <h1
            style="
              margin: 0;
            "
          >
            Tareas
          </h1>

          <p
            id="nombreUsuario"
            style="
              margin: 4px 0 0;
            "
          >
            Cargando...
          </p>

        </div>

      </div>

    </div>


    <div class="portal-header-right">

      <a
        href="../../index.html"
        class="btn btn-secondary"
        style="
          text-decoration: none;
        "
      >
        ← Volver al portal
      </a>


      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="portal-container">


    <!-- ===================================================
         CABECERA DEL MÓDULO
         =================================================== -->

    <section class="welcome-section">

      <h2>
        Mis tareas
      </h2>

      <p>
        Consulta las tareas asignadas y actualiza su estado
        cuando hayas avanzado en ellas.
      </p>

    </section>



    <!-- ===================================================
         LISTADO DE TAREAS
         =================================================== -->

    <section
      style="
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 30px;
      "
    >

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 20px;
          margin-bottom: 25px;
          flex-wrap: wrap;
        "
      >

        <div>

          <h2
            style="
              margin: 0 0 6px;
              color: #111827;
            "
          >
            Tareas asignadas
          </h2>

          <p
            style="
              margin: 0;
              color: #6b7280;
              font-size: 14px;
            "
          >
            Aquí puedes consultar tus tareas y modificar
            únicamente su estado.
          </p>

        </div>


        <button
          id="recargarTareas"
          class="btn btn-secondary"
          type="button"
        >
          ↻ Recargar tareas
        </button>

      </div>


      <p
        id="listadoMessage"
        class="message"
      ></p>


      <div
        id="tareasContainer"
        style="
          display: flex;
          flex-direction: column;
          gap: 16px;
        "
      >
        Cargando tareas...
      </div>

    </section>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

    Portal del Cliente · Kit Gestión Asesoría

  </footer>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const API_URL =
      "https://kit-asesoria-backend.vhtza8.easypanel.host";


    // =====================================================
    // SESIÓN
    // =====================================================

    const token =
      localStorage.getItem("token");


    const usuarioGuardado =
      localStorage.getItem("usuario");


    if (!token || !usuarioGuardado) {

      window.location.href =
        "../../login.html";
    }


    let usuario;


    try {

      usuario =
        JSON.parse(usuarioGuardado);


      document
        .getElementById("nombreUsuario")
        .textContent =
          `Hola, ${usuario.nombre}`;

    } catch (error) {

      console.error(
        "Error leyendo los datos del usuario:",
        error
      );


      localStorage.removeItem("token");
      localStorage.removeItem("usuario");


      window.location.href =
        "../../login.html";
    }


    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        () => {

          localStorage.removeItem("token");
          localStorage.removeItem("usuario");

          window.location.href =
            "../../login.html";
        }
      );


    // =====================================================
    // CARGAR TAREAS
    // =====================================================

    async function cargarTareas() {

      const container =
        document.getElementById(
          "tareasContainer"
        );


      const message =
        document.getElementById(
          "listadoMessage"
        );


      container.innerHTML =
        "Cargando tareas...";

      message.textContent = "";


      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/tareas`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          container.innerHTML = "";

          message.textContent =
            datos.message ||
            "No se han podido cargar las tareas.";

          return;
        }


        if (
          !Array.isArray(datos.tareas) ||
          datos.tareas.length === 0
        ) {

          container.innerHTML = `

            <div
              style="
                text-align: center;
                padding: 40px 20px;
                border: 1px dashed #d1d5db;
                border-radius: 10px;
                background: #f9fafb;
              "
            >

              <div
                style="
                  font-size: 36px;
                  margin-bottom: 12px;
                "
              >
                ✅
              </div>

              <h3
                style="
                  margin: 0 0 8px;
                  color: #111827;
                "
              >
                No tienes tareas pendientes
              </h3>

              <p
                style="
                  margin: 0;
                  color: #6b7280;
                "
              >
                Cuando tu asesoría te asigne una tarea,
                aparecerá aquí.
              </p>

            </div>

          `;

          return;
        }


        container.innerHTML = "";


        datos.tareas.forEach(
          (tarea) => {

            const article =
              document.createElement(
                "article"
              );


            article.style.cssText = `
              border: 1px solid #e5e7eb;
              border-radius: 12px;
              padding: 22px;
              background: #ffffff;
              box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            `;


            // =================================================
            // CABECERA DE LA TAREA
            // =================================================

            const cabecera =
              document.createElement(
                "div"
              );


            cabecera.style.cssText = `
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              gap: 15px;
              margin-bottom: 16px;
              flex-wrap: wrap;
            `;


            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              tarea.titulo;


            titulo.style.cssText = `
              margin: 0;
              color: #111827;
              font-size: 18px;
            `;


            cabecera.appendChild(
              titulo
            );


            // =================================================
            // DESCRIPCIÓN
            // =================================================

            const descripcion =
              document.createElement(
                "p"
              );


            descripcion.textContent =
              tarea.descripcion ||
              "Sin descripción";


            descripcion.style.cssText = `
              margin: 0 0 18px;
              color: #6b7280;
              line-height: 1.6;
            `;


            // =================================================
            // INFORMACIÓN
            // =================================================

            const informacion =
              document.createElement(
                "div"
              );


            informacion.style.cssText = `
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
              gap: 12px;
              margin-bottom: 20px;
            `;


            const prioridad =
              document.createElement(
                "div"
              );


            prioridad.style.cssText = `
              padding: 12px 14px;
              background: #f9fafb;
              border-radius: 8px;
              border: 1px solid #f0f0f0;
            `;


            prioridad.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  font-weight: 600;
                  color: #6b7280;
                  margin-bottom: 4px;
                "
              >
                PRIORIDAD
              </div>

              <div
                style="
                  color: #111827;
                  font-weight: 500;
                "
              >
                ${tarea.prioridad || "-"}
              </div>
            `;


            const fechaLimite =
              document.createElement(
                "div"
              );


            fechaLimite.style.cssText = `
              padding: 12px 14px;
              background: #f9fafb;
              border-radius: 8px;
              border: 1px solid #f0f0f0;
            `;


            fechaLimite.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  font-weight: 600;
                  color: #6b7280;
                  margin-bottom: 4px;
                "
              >
                FECHA LÍMITE
              </div>

              <div
                style="
                  color: #111827;
                  font-weight: 500;
                "
              >
                ${formatearFecha(tarea.fechaLimite)}
              </div>
            `;


            informacion.appendChild(
              prioridad
            );


            informacion.appendChild(
              fechaLimite
            );


            // =================================================
            // ESTADO
            // =================================================

            const estadoContainer =
              document.createElement(
                "div"
              );


            estadoContainer.style.cssText = `
              border-top: 1px solid #e5e7eb;
              padding-top: 18px;
              display: flex;
              align-items: center;
              gap: 12px;
              flex-wrap: wrap;
            `;


            const estadoLabel =
              document.createElement(
                "label"
              );


            estadoLabel.textContent =
              "Estado";


            estadoLabel.style.cssText = `
              font-size: 14px;
              font-weight: 600;
              color: #374151;
            `;


            const estadoSelect =
              document.createElement(
                "select"
              );


            estadoSelect.style.cssText = `
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 8px;
              background: #ffffff;
              color: #374151;
              font-size: 14px;
              min-width: 150px;
              outline: none;
            `;


            const estadosPermitidos = [
              "PENDIENTE",
              "EN_PROCESO",
              "COMPLETADA",
              "CANCELADA"
            ];


            estadosPermitidos.forEach(
              (estado) => {

                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  estado;


                option.textContent =
                  formatearEstado(
                    estado
                  );


                if (
                  tarea.estado === estado
                ) {

                  option.selected =
                    true;
                }


                estadoSelect.appendChild(
                  option
                );
              }
            );


            // =================================================
            // BOTÓN ACTUALIZAR ESTADO
            // =================================================

            const actualizar =
              document.createElement(
                "button"
              );


            actualizar.type =
              "button";


            actualizar.textContent =
              "Actualizar estado";


            actualizar.className =
              "btn btn-primary";


            actualizar.addEventListener(
              "click",
              () =>
                actualizarEstado(
                  tarea.id,
                  estadoSelect.value,
                  actualizar
                )
            );


            estadoContainer.appendChild(
              estadoLabel
            );


            estadoContainer.appendChild(
              estadoSelect
            );


            estadoContainer.appendChild(
              actualizar
            );


            // =================================================
            // CONSTRUIR TAREA
            // =================================================

            article.appendChild(
              cabecera
            );


            article.appendChild(
              descripcion
            );


            article.appendChild(
              informacion
            );


            article.appendChild(
              estadoContainer
            );


            container.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando tareas:",
          error
        );


        container.innerHTML = "";


        message.textContent =
          "No se ha podido conectar con el servidor.";
      }
    }


    // =====================================================
    // ACTUALIZAR ESTADO
    // =====================================================

    async function actualizarEstado(
      tareaId,
      nuevoEstado,
      boton
    ) {

      boton.disabled =
        true;


      boton.textContent =
        "Guardando...";


      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/tareas/${tareaId}`,
            {
              method: "PATCH",

              headers: {
                "Authorization":
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                estado: nuevoEstado
              })
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido actualizar el estado."
          );


          boton.disabled =
            false;


          boton.textContent =
            "Actualizar estado";


          return;
        }


        boton.textContent =
          "Estado actualizado";


        setTimeout(
          () => {

            boton.disabled =
              false;

            boton.textContent =
              "Actualizar estado";

          },
          1500
        );

      } catch (error) {

        console.error(
          "Error actualizando estado:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );


        boton.disabled =
          false;


        boton.textContent =
          "Actualizar estado";
      }
    }


    // =====================================================
    // RECARGAR
    // =====================================================

    document
      .getElementById(
        "recargarTareas"
      )
      .addEventListener(
        "click",
        cargarTareas
      );


    // =====================================================
    // FORMATEAR FECHA
    // =====================================================

    function formatearFecha(
      fecha
    ) {

      if (!fecha) {
        return "-";
      }


      const fechaObjeto =
        new Date(fecha);


      return fechaObjeto.toLocaleString(
        "es-ES",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );
    }


    // =====================================================
    // FORMATEAR ESTADO
    // =====================================================

    function formatearEstado(
      estado
    ) {

      const estados = {
        PENDIENTE: "Pendiente",
        EN_PROCESO: "En proceso",
        COMPLETADA: "Completada",
        CANCELADA: "Cancelada"
      };


      return estados[estado] ||
        estado;
    }


    // =====================================================
    // INICIO
    // =====================================================

    cargarTareas();

  </script>


</body>

</html>
