
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Calendario - Portal del Cliente</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <div
        style="
          display: flex;
          align-items: center;
          gap: 14px;
        "
      >

        <div
          style="
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            border-radius: 12px;
            font-size: 24px;
          "
        >
          📅
        </div>

        <div>

          <h1>
            Calendario
          </h1>

          <p id="nombreUsuario">
            Cargando...
          </p>

        </div>

      </div>

    </div>


    <div class="portal-header-right">

      <a
        href="../../index.html"
        class="btn btn-secondary"
        style="
          text-decoration: none;
        "
      >
        ← Volver al portal
      </a>

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="portal-container">


    <!-- ===================================================
         CABECERA DEL MÓDULO
         =================================================== -->

    <section class="welcome-section">

      <h2>
        Mis eventos
      </h2>

      <p>
        Consulta tus citas y próximos eventos de la asesoría.
      </p>

    </section>



    <!-- ===================================================
         CALENDARIO / LISTADO
         =================================================== -->

    <section class="dashboard-section">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          flex-wrap: wrap;
          margin-bottom: 25px;
        "
      >

        <div>

          <h2
            style="
              margin: 0 0 5px 0;
            "
          >
            Próximos eventos
          </h2>

          <p
            style="
              margin: 0;
              color: #6b7280;
              font-size: 14px;
            "
          >
            Aquí podrás consultar las citas y eventos asociados a tu cuenta.
          </p>

        </div>


        <button
          id="recargarEventos"
          class="btn btn-primary"
          type="button"
        >
          ↻ Recargar calendario
        </button>

      </div>


      <p
        id="eventosMessage"
        class="message"
      ></p>


      <div
        id="eventosContainer"
        style="
          display: grid;
          gap: 18px;
        "
      >
        Cargando eventos...
      </div>

    </section>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

    Portal del Cliente · Kit Gestión Asesoría

  </footer>



  <script>

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    const API_URL =
      "https://kit-asesoria-backend.vhtza8.easypanel.host";


    // =====================================================
    // SESIÓN
    // =====================================================

    const token =
      localStorage.getItem("token");


    const usuarioGuardado =
      localStorage.getItem("usuario");


    if (!token || !usuarioGuardado) {

      window.location.href =
        "../../login.html";
    }


    let usuario;


    try {

      usuario =
        JSON.parse(usuarioGuardado);


      document
        .getElementById("nombreUsuario")
        .textContent =
          `Hola, ${usuario.nombre}`;

    } catch (error) {

      console.error(
        "Error leyendo los datos del usuario:",
        error
      );


      localStorage.removeItem("token");
      localStorage.removeItem("usuario");


      window.location.href =
        "../../login.html";
    }



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        () => {

          localStorage.removeItem("token");
          localStorage.removeItem("usuario");

          window.location.href =
            "../../login.html";

        }
      );



    // =====================================================
    // CARGAR EVENTOS
    // =====================================================

    async function cargarEventos() {

      const container =
        document.getElementById(
          "eventosContainer"
        );


      const message =
        document.getElementById(
          "eventosMessage"
        );


      container.innerHTML = `
        <div
          style="
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #6b7280;
          "
        >
          Cargando eventos...
        </div>
      `;


      message.textContent = "";


      try {

        const respuesta =
          await fetch(
            `${API_URL}/api/eventos-calendario`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          container.innerHTML = "";

          message.textContent =
            datos.message ||
            "No se han podido cargar los eventos.";

          return;
        }


        if (
          !Array.isArray(datos.eventos) ||
          datos.eventos.length === 0
        ) {

          container.innerHTML = `
            <div
              style="
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                padding: 45px 30px;
                text-align: center;
              "
            >

              <div
                style="
                  font-size: 42px;
                  margin-bottom: 15px;
                "
              >
                📅
              </div>

              <h3
                style="
                  margin: 0 0 8px 0;
                  color: #111827;
                "
              >
                No tienes eventos
              </h3>

              <p
                style="
                  margin: 0;
                  color: #6b7280;
                "
              >
                No hay eventos programados en este momento.
              </p>

            </div>
          `;

          return;
        }


        container.innerHTML = "";


        datos.eventos.forEach(
          (evento) => {

            const article =
              document.createElement(
                "article"
              );


            article.style.cssText = `
              background: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 12px;
              padding: 24px;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            `;


            // =================================================
            // CABECERA DEL EVENTO
            // =================================================

            const cabecera =
              document.createElement(
                "div"
              );


            cabecera.style.cssText = `
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              gap: 15px;
              flex-wrap: wrap;
              margin-bottom: 18px;
            `;


            // =================================================
            // TÍTULO
            // =================================================

            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              evento.titulo;


            titulo.style.cssText = `
              margin: 0;
              color: #111827;
              font-size: 19px;
            `;


            // =================================================
            // TIPO
            // =================================================

            const tipo =
              document.createElement(
                "span"
              );


            tipo.textContent =
              evento.tipo || "-";


            tipo.style.cssText = `
              display: inline-flex;
              align-items: center;
              padding: 6px 10px;
              border-radius: 999px;
              background: #eef2ff;
              color: #4338ca;
              font-size: 13px;
              font-weight: 600;
              white-space: nowrap;
            `;


            cabecera.appendChild(
              titulo
            );


            cabecera.appendChild(
              tipo
            );


            article.appendChild(
              cabecera
            );



            // =================================================
            // INFORMACIÓN DE FECHA
            // =================================================

            const fechas =
              document.createElement(
                "div"
              );


            fechas.style.cssText = `
              display: flex;
              flex-direction: column;
              gap: 8px;
              padding: 16px;
              background: #f9fafb;
              border-radius: 10px;
              margin-bottom: 20px;
            `;


            const fecha =
              document.createElement(
                "div"
              );


            fecha.style.cssText = `
              color: #374151;
              font-size: 14px;
              font-weight: 600;
            `;


            if (evento.todoElDia) {

              fecha.textContent =
                `📅 Fecha: ${
                  formatearFecha(
                    evento.fechaInicio
                  )
                } — Todo el día`;

            } else {

              fecha.textContent =
                `📅 Inicio: ${
                  formatearFechaHora(
                    evento.fechaInicio
                  )
                }`;

            }


            fechas.appendChild(
              fecha
            );


            // =================================================
            // FECHA FIN
            // =================================================

            const fechaFin =
              document.createElement(
                "div"
              );


            fechaFin.style.cssText = `
              color: #6b7280;
              font-size: 14px;
            `;


            if (!evento.todoElDia) {

              fechaFin.textContent =
                `Fin: ${
                  formatearFechaHora(
                    evento.fechaFin
                  )
                }`;

            } else {

              fechaFin.textContent =
                "";

            }


            fechas.appendChild(
              fechaFin
            );


            article.appendChild(
              fechas
            );



            // =================================================
            // DESCRIPCIÓN
            // =================================================

            const descripcion =
              document.createElement(
                "div"
              );


            descripcion.style.cssText = `
              color: #374151;
              line-height: 1.6;
              margin-bottom: 20px;
              white-space: pre-wrap;
            `;


            descripcion.textContent =
              evento.descripcion ||
              "Sin descripción";


            article.appendChild(
              descripcion
            );



            // =================================================
            // DETALLES
            // =================================================

            const detalles =
              document.createElement(
                "div"
              );


            detalles.style.cssText = `
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
              gap: 12px;
              padding: 16px;
              background: #f9fafb;
              border-radius: 10px;
              margin-bottom: 20px;
            `;


            // =================================================
            // UBICACIÓN
            // =================================================

            const ubicacion =
              document.createElement(
                "div"
              );


            ubicacion.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Ubicación
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${evento.ubicacion || "-"}
              </div>
            `;


            // =================================================
            // ESTADO
            // =================================================

            const estado =
              document.createElement(
                "div"
              );


            estado.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Estado
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${evento.estado || "-"}
              </div>
            `;


            // =================================================
            // EMPRESA
            // =================================================

            const empresa =
              document.createElement(
                "div"
              );


            empresa.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Empresa
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${evento.empresa?.nombre || "-"}
              </div>
            `;


            // =================================================
            // OFICINA
            // =================================================

            const oficina =
              document.createElement(
                "div"
              );


            oficina.innerHTML = `
              <div
                style="
                  font-size: 12px;
                  color: #6b7280;
                  margin-bottom: 3px;
                "
              >
                Oficina
              </div>

              <div
                style="
                  font-size: 14px;
                  font-weight: 600;
                  color: #374151;
                "
              >
                ${evento.oficina?.nombre || "-"}
              </div>
            `;


            detalles.appendChild(
              ubicacion
            );


            detalles.appendChild(
              estado
            );


            detalles.appendChild(
              empresa
            );


            detalles.appendChild(
              oficina
            );


            article.appendChild(
              detalles
            );



            // =================================================
            // CREADO POR
            // =================================================

            const creado =
              document.createElement(
                "p"
              );


            creado.style.cssText = `
              margin: 0;
              color: #6b7280;
              font-size: 13px;
            `;


            creado.innerHTML = `
              Creado por:
              <strong
                style="
                  color: #374151;
                "
              >
                ${evento.creadoPorUsuario?.nombre || "-"}
              </strong>
            `;


            article.appendChild(
              creado
            );


            container.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando eventos:",
          error
        );


        container.innerHTML = "";


        message.textContent =
          "No se ha podido conectar con el servidor.";

      }

    }



    // =====================================================
    // RECARGAR
    // =====================================================

    document
      .getElementById(
        "recargarEventos"
      )
      .addEventListener(
        "click",
        cargarEventos
      );



    // =====================================================
    // FORMATEAR FECHA
    // =====================================================

    function formatearFecha(
      fecha
    ) {

      if (!fecha) {
        return "-";
      }


      const fechaObjeto =
        new Date(fecha);


      if (
        Number.isNaN(
          fechaObjeto.getTime()
        )
      ) {

        return "-";
      }


      return fechaObjeto.toLocaleDateString(
        "es-ES"
      );

    }



    // =====================================================
    // FORMATEAR FECHA Y HORA
    // =====================================================

    function formatearFechaHora(
      fecha
    ) {

      if (!fecha) {
        return "-";
      }


      const fechaObjeto =
        new Date(fecha);


      if (
        Number.isNaN(
          fechaObjeto.getTime()
        )
      ) {

        return "-";
      }


      return fechaObjeto.toLocaleString(
        "es-ES",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }



    // =====================================================
    // INICIO
    // =====================================================

    cargarEventos();

  </script>


</body>

</html>
